name: Assemble complete Klarblatt tree

on:
  push:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct exact Klarblatt tree
        shell: bash
        run: |
          set -euo pipefail
          git archive HEAD > /tmp/overlay.tar
          base64 -d .github/klarblatt-remaining.patch.gz.b64 | gzip -d > /tmp/remaining.patch
          git clone https://github.com/Philipp0205/kindle-rss.git /tmp/extrablatt
          git -C /tmp/extrablatt checkout bb07708ee6ef7361bdf79e0751c3041748e5fe72

          git rm -rf .
          git -C /tmp/extrablatt archive bb07708ee6ef7361bdf79e0751c3041748e5fe72 | tar -x
          tar -xf /tmp/overlay.tar

          rm -f .github/workflows/assemble-klarblatt.yml
          rm -f .github/klarblatt-remaining.patch.gz.b64
          rm -rf .cursor
          rm -f docs/accessibility-edition.md
          rm -f src/test/java/com/kindlerss/web/EditionResolverTest.java
          git apply --binary /tmp/remaining.patch
          chmod +x mvnw deploy/*.sh

          git add -A
          actual_tree="$(git write-tree)"
          expected_tree="71409f90263cc3a96332140d3b7360afe917e639"
          test "$actual_tree" = "$expected_tree"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add remaining Klarblatt sources"
          git push origin HEAD:main
